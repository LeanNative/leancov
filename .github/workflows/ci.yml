name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lean via elan
        shell: bash
        run: |
          TOOLCHAIN="$(tr -d '[:space:]' < lean-toolchain)"
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain "$TOOLCHAIN"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          lean --version
          lake --version

      - name: Build
        run: lake build leancov leancov-rt-test leancov-test leancov-fuzz-test

      - name: Run test suites
        run: |
          .lake/build/bin/leancov --version
          .lake/build/bin/leancov-rt-test
          lake test

      - name: Self-coverage dogfood pass (via leancov.toml)
        run: |
          .lake/build/bin/leancov test --config leancov.toml --clean
          rm -rf build/leancov

      - name: Setup smoke project for action.yml
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          rm -rf build/action_smoke
          mkdir -p build/action_smoke/Demo
          cp lean-toolchain build/action_smoke/lean-toolchain
          cat > build/action_smoke/lakefile.toml <<'EOF'
          name = "smoke"
          defaultTargets = ["smoke-test"]
          [[lean_lib]]
          name = "Demo"
          [[lean_exe]]
          name = "smoke-test"
          root = "Main"
          EOF
          cat > build/action_smoke/Demo.lean <<'EOF'
          import Demo.Core
          EOF
          cat > build/action_smoke/Demo/Core.lean <<'EOF'
          def f (x : Nat) : Nat := if x > 0 then x else 0
          EOF
          cat > build/action_smoke/Main.lean <<'EOF'
          import Demo
          def main : IO UInt32 := if f 1 == 1 then pure 0 else pure 1
          EOF
          cat > build/action_smoke/leancov.toml <<'EOF'
          [leancov]
          out = "out"
          min_cov = 40.0
          [[package]]
          name = "smoke"
          pkg = "."
          src_dirs = ["Demo"]
          exclude = ["Main.lean"]
          [[suite]]
          name = "smoke-test"
          package = "smoke"
          EOF

      - name: Test local composite action.yml
        if: matrix.os == 'ubuntu-latest'
        uses: ./
        with:
          version: local
          config: build/action_smoke/leancov.toml
          upload-html: 'false'
          step-summary: 'false'

      - name: Cleanup action smoke
        if: always() && matrix.os == 'ubuntu-latest'
        run: rm -rf build/action_smoke
